name: Publish to Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.3)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update manifest version
        run: |
          jq --arg v "${{ github.event.inputs.version }}" '.version = $v' \
            extension/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json extension/manifest.json

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json
          git commit -m "chore(release): bump version to ${{ github.event.inputs.version }}"
          git push

      - name: Create and push tag
        run: |
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Build extension zip
        run: |
          zip -r "github-workflow-navigator-v${{ github.event.inputs.version }}.zip" extension \
            --exclude "*.DS_Store" \
            --exclude "*__MACOSX*"

      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          ACCESS_TOKEN=$(curl -sf -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token" \
            | jq -r '.access_token')

          UPLOAD=$(curl -sf -X PUT \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${EXTENSION_ID}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -T "github-workflow-navigator-v${{ github.event.inputs.version }}.zip")
          echo "$UPLOAD"
          [ "$(echo "$UPLOAD" | jq -r '.uploadState')" = "SUCCESS" ] || exit 1

          curl -sf -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}/publish" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 .github/scripts/generate_release_notes.py > release_notes.md
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release_notes.md \
            "github-workflow-navigator-v${VERSION}.zip"
