name: Publish to Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.3)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update manifest version
        run: |
          jq --arg v "${{ github.event.inputs.version }}" '.version = $v' \
            extension/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json extension/manifest.json

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json
          git commit -m "chore(release): bump version to ${{ github.event.inputs.version }}"
          git push

      - name: Create and push tag
        run: |
          git tag "${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"

      - name: Build extension zip
        run: |
          zip -r "github-workflow-navigator-${{ github.event.inputs.version }}.zip" extension \
            --exclude "*.DS_Store" \
            --exclude "*__MACOSX*"

      - name: Upload to Chrome Web Store
        uses: Klemensas/chrome-extension-upload-action@1.4.1
        with:
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          file-name: './github-workflow-navigator-${{ github.event.inputs.version }}.zip'
          app-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publish: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 .github/scripts/generate_release_notes.py > release_notes.md
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file release_notes.md \
            "github-workflow-navigator-${VERSION}.zip"
